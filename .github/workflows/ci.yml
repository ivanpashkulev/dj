name: DJ app CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Build application
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-and-publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ivanpashkulev/devops/.github/workflows/build-and-publish.yml@main
    secrets:
      DEVOPS_TOKEN: ${{ secrets.DEVOPS_PAT }}
    
